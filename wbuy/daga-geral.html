<!--
    ========== DAGA BEBIDAS - VISUAL GERAL DA LOJA (WBUY) ==========
    Onde fica no painel: Configurações > Scripts por página > "Daga - Visual geral"
    (Posição: HEAD / Página: Todas as páginas).

    Deixa topo, rodapé, categorias, busca, produto, carrinho e checkout com o mesmo
    visual da nova página inicial (cores do guia Daga: cobre, ouro, prata e preto; fontes Antonio, Saira Condensed e Outfit,
    cards arredondados). Só CSS: não mexe em preço, estoque, frete nem pagamento.
    Atenção: o campo da wBuy grava em Latin-1. Não use travessão, emoji nem aspas curvas aqui.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Antonio:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap');

/* ========== CORES E FONTES (EDITÁVEL) ========== */
:root {
    --dg-primary: #a66421;
    --dg-primary-dark: #1d1d1b;
    --dg-primary-light: #d6c39b;
    --dg-cafe: #1d1d1b;
    --dg-bg: #f5f5f4;
    --dg-bg-card: #ebe9e4;
    --dg-white: #ffffff;
    --dg-text: #1d1d1b;
    --dg-text-light: #5f5d58;
    --dg-price: #3f7a3a;
    --dg-font: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --dg-font-title: 'Antonio', 'Arial Narrow', sans-serif;
    --dg-font-label: 'Saira Condensed', 'Arial Narrow', sans-serif;
    --dg-ouro: #9e814a;
    --dg-shadow: 0 6px 24px rgba(29, 29, 27, 0.08);
    --dg-shadow-hover: 0 14px 36px rgba(29, 29, 27, 0.16);
    --dg-radius: 18px;
}

/* ========== BASE ========== */
body {

    color: var(--dg-text);

}

#finish button[type="submit"] {

    font-family: var(--dg-font) !important;
    font-weight: 600 !important;
    letter-spacing: 0.04em;
    transition: all 0.3s ease;
}
.bt-comprar:hover,
.bt-finalizar:hover,
#finish .btn-dark:hover,
#finish button[type="submit"]:hover {
    background: var(--dg-primary) !important;
    border-color: var(--dg-primary) !important;
}

/* ========== TOPO ========== */
header .logoheader,
header .links,
header .menu_scroll {
    font-family: var(--dg-font);
}
header .links nav > ul > li > a,
header .menu_scroll a {
    font-family: var(--dg-font);
    font-weight: 500;
    letter-spacing: 0.06em;
}
header .links nav > ul > li > a {
    position: relative;
}
header .links nav > ul > li > a::after {
    content: '';
    position: absolute;
    left: 50%;
    right: 50%;
    bottom: -4px;
    height: 2px;
    background: var(--dg-primary-light);
    transition: all 0.3s ease;
}

    right: 12px;
}
/* Menu suspenso */

    box-shadow: var(--dg-shadow-hover);
}

}
/* Letras do menu suspenso na cor do topo (cobre); negrito só no hover */
header .links .drop,
header .links .drop li,
header .links .drop a {
    color: var(--dg-primary) !important;
}
header .links .drop a {
    font-weight: 400 !important;
}
header .links .drop a:hover {
    color: var(--dg-primary) !important;
    font-weight: 700 !important;
}
/* Busca */
header .search input,
header input[name="q"],
header input[type="search"] {
    border-radius: 50px;
    font-family: var(--dg-font);
}

.vitrine_h .owl-stage,
